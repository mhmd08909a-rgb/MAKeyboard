plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.ma.keyboard'
    compileSdk 34

    defaultConfig {
        applicationId 'com.ma.keyboard'
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName '1.4.0'
    }

    signingConfigs {
        makb {
            storeFile file('makeyboard.keystore')
            storePassword 'makeyboard'
            keyAlias 'makeyboard'
            keyPassword 'makeyboard'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.makb
        }
        debug {
            signingConfig signingConfigs.makb
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // No third-party libraries: only the Android SDK and the Kotlin standard library.
}
